name: CI

# Build verification only. Deployment is Cloudflare's job: it builds this repo
# directly on push to main, so publishing from here too would put a second,
# indexable copy of the site on github.io competing with filetax.co.
#
# This workflow exists to catch a broken build or a failed prerender BEFORE
# Cloudflare ships it, since Cloudflare's own build is intentionally tolerant of
# a prerender failure (see scripts/postbuild.mjs).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # v4 of these actions runs on the Node 20 action runtime, which GitHub has
      # deprecated and now force-runs on Node 24. v5 targets Node 24 natively.
      # node-version below is the Node used to build the site, unrelated to the
      # runtime the actions themselves execute on.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Portal.tsx error this used to tolerate ("Property 'id' does not
      # exist on type 'never'") went away with the portal merge. `tsc --noEmit`
      # is clean, so type errors gate the build again.
      - name: Typecheck
        run: npm run typecheck

      # A bare `$350` sat in live copy on /past-filings after the price became
      # $99 + $199, and two outside reviews reasoned from that wrong number
      # before it was caught. This fails on any dollar figure that equals one of
      # our prices and is not derived from pricing.ts. Cheap, so it runs early.
      - name: Check for hardcoded price literals
        run: npm run verify:prices

      # A clicked error message that jumps to a field which is not in the markup
      # does nothing at all, and doing nothing is indistinguishable from a click
      # that missed. Cheap, static, so it runs beside the price check.
      - name: Check every anchored error message has a field
        run: npm run verify:anchors

      # --with-deps needs apt, which is available here but not in Cloudflare's
      # build sandbox. postbuild's own install then becomes a cached no-op.
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # PRERENDER_STRICT makes postbuild.mjs fail loudly instead of degrading to
      # the client-rendered shell, so a prerender regression cannot pass CI.
      #
      # The Supabase vars are not optional here. src/lib/supabase.ts THROWS at
      # module load when they are absent; every prerendered route imports the
      # router, the router imports Portal, and Portal imports that client. So a
      # build without them fails at the prerender, not at runtime.
      #
      # Both are VITE_ prefixed and therefore compiled into the public bundle,
      # exactly as they already are on Cloudflare. They are repo secrets here
      # only because Actions has no other place to put a build-time value, not
      # because either one is confidential. The anon key is the publishable
      # `sb_publishable_` format and RLS is what protects the data.
      - name: Build
        run: npm run build
        env:
          PRERENDER_STRICT: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify prerendered output
        run: |
          fail=0
          # Homepage must contain rendered content, not the empty shell.
          if ! grep -q 'Missed Form 5472' dist/index.html; then
            echo "::error::dist/index.html is still the empty shell"
            fail=1
          fi
          # Flat per-route files, not <route>/index.html: Cloudflare 308-redirects
          # the directory form to a trailing slash, which would break every
          # indexed URL.
          for f in pricing services faq resources check past-filings waitlist terms privacy; do
            if [ ! -f "dist/$f.html" ]; then
              echo "::error::dist/$f.html missing"
              fail=1
            fi
          done
          # Private routes need a 200-serving shell, or Cloudflare answers 404.
          for f in portal auth dashboard; do
            if [ ! -f "dist/$f.html" ]; then
              echo "::error::dist/$f.html missing (private route would 404)"
              fail=1
            fi
          done
          if [ ! -f dist/404.html ]; then
            echo "::error::dist/404.html missing (unknown URLs would return 200)"
            fail=1
          fi
          articles=$(find dist/resources -maxdepth 1 -name '*.html' | wc -l)
          echo "Prerendered articles: $articles"
          if [ "$articles" -lt 25 ]; then
            echo "::error::only $articles article pages prerendered, expected ~29"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All prerender checks passed."
