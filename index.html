<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website creation request (Copy)</title>
    <link rel="icon" href="data:,">
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Decodes the redirected URL from 404.html back into the real route,
      // including query strings (e.g. portal?mode=signup)
      (function(l) {
        if (l.search[1] === '/') {
          // Grab everything after the leading '/?/'
          var encoded = l.search.slice(2); // drop the '/?/' prefix chars: '/' + '?'
          // Split on the first '?' that was originally in the app path (encoded as part of appPath)
          // ~and~ stands for & in the original query string
          var parts = encoded.split('?');
          var appPath = parts[0].replace(/~and~/g, '&');
          var qs = parts.slice(1).join('?').replace(/~and~/g, '&');
          var newUrl = l.pathname + '/' + appPath + (qs ? '?' + qs : '') + l.hash;
          window.history.replaceState(null, null, newUrl);
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
