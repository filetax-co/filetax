<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // MIT License - Rafael Pedicini
      //
      // segmentCount = 1 because the site is served at /5472/
      // (one path segment is the repo name, not part of your app's route)
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var pathParts = l.pathname.split('/');
      var basePath = pathParts.slice(0, 1 + pathSegmentsToKeep).join('/');
      var appPath = pathParts.slice(1 + pathSegmentsToKeep).join('/');

      // Encode the full path + search + hash into a single query param
      // so index.html can decode it back
      var encoded = (appPath ? '/' + appPath : '')
        + (l.search ? l.search.replace(/&/g, '~and~') : '')
        + l.hash;

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/?/' + encoded.replace(/^\//, '')
      );
    </script>
  </head>
  <body>
  </body>
</html>
